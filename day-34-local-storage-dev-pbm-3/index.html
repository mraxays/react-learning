<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-black text-white p-4">

    <span id="status" class="block mb-4 text-lg">User Status: Unknown</span>

    <button id="blockBtn" class="bg-green-600 hover:bg-green-800 transition duration-300 cursor-pointer text-white py-2 px-4 rounded">
        Block User
    </button>
    <button id="unblockBtn" class="bg-red-600 hover:bg-red-800 transition duration-300 cursor-pointer text-white py-2 px-4 rounded">
        Unblock User
    </button>
    <button id="removeDataBtn" class="bg-yellow-600 hover:bg-yellow-800 transition duration-300 cursor-pointer text-white py-2 px-4 rounded">
        Remove Local Storage Data
    </button>

    <script src="script.js"></script>

</body>

</html>
